name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            [ -f app/debug.keystore ] || echo "::warning::No app/debug.keystore and no RELEASE_KEYSTORE_BASE64, so this APK uses a throwaway key and won't install over earlier builds."
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/CLauncher.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CLauncher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clauncher-apk
          path: dist/*.apk

      # Every push to main becomes a GitHub Release, so the APK is one click away.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/CLauncher.apk dist/CLauncher-debug.apk \
            --title "CLauncher build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install CLauncher.apk on your TV." \
            --target "${{ github.sha }}" \
            --latest
